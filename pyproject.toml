[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-agent"
version = "0.1.0"
description = "Self-improving crypto/forex research and paper-trading agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "ccxt>=4.4",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
trade-agent = "trade_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/trade_agent" = "trade_agent"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
